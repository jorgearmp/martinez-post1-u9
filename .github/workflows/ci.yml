name: Java CI/CD Pipeline - Unidad 9

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repositorio
      uses: actions/checkout@v3

    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilar y Ejecutar Pruebas Unitarias con JUnit 5 y Mockito
      run: mvn clean test

    - name: Empaquetar JAR
      run: mvn package -DskipTests
